<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - 404</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1c1c, #ab8d8d);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            color: #ff5e5e;
        }
        h2 {
            font-size: 1.8rem;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #dcdcdc;
        }
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #ff5e5e;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #e04848;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>¡Pagina NO ENCONTRADA!</h2>
        <p>La página que buscas no existe.</p>
        <a href="/" class="btn">Volver al Inicio</a>
    </div>
</body>
</html>
