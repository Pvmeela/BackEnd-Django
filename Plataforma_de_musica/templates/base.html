
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MusicVibe{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #151020, #35204f, #6a367f);
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 22px 7%;
            background: rgba(15, 10, 25, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #d8a5ff;
            text-decoration: none;
        }

        .inicio {
            color: #e9d5ff;
            text-decoration: none;
            font-size: 14px;
        }

        .inicio:hover {
            color: #ffffff;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
        }

        .tarjeta {
            width: 100%;
            max-width: 460px;
            background: rgba(23, 16, 38, 0.9);
            border: 1px solid rgba(216, 165, 255, 0.2);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .icono {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9333ea, #db2777);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .subtitulo {
            text-align: center;
            color: #d4c6e2;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            color: #e9d5ff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #29203e;
            border: 1px solid #69458c;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15);
        }

        .btn-principal {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea, #db2777);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-principal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(219, 39, 119, 0.35);
        }

        .enlace {
            color: #d8a5ff;
            text-decoration: none;
        }

        .enlace:hover {
            text-decoration: underline;
        }

        .texto-inferior {
            text-align: center;
            margin-top: 25px;
            color: #d4c6e2;
            font-size: 14px;
        }

        .errores {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #fb7185;
            color: #fecdd3;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .ayuda {
            color: #c6b5d5;
            font-size: 12px;
            margin: -8px 0 16px;
            line-height: 1.5;
        }

        .ayuda ul {
            padding-left: 18px;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #c6b5d5;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .tarjeta {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="barra">
            <a href="{% url 'bienvenida' %}" class="logo">
                ♫ MusicVibe
            </a>

            <a href="{% url 'bienvenida' %}" class="inicio">
                Inicio
            </a>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        © 2026 MusicVibe | Plataforma de Música
    </footer>
</body>
</html>
