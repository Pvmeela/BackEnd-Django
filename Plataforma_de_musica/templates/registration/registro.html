
{% extends "base.html" %}

{% block titulo %}
Registro de Usuario
{% endblock %}

{% block titulo_encabezado %}
Registro de Usuario
{% endblock %}

{% block contenido %}

<h2>Crear una cuenta</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Registrarse</button>
</form>

<p>
    ¿Ya tienes una cuenta?
    <a href="{% url 'login' %}">Iniciar sesión</a>
</p>

{% endblock %}
