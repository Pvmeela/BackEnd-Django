
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
</head>
<body>
    <h1>Plataforma de Música</h1>
    <h2>Iniciar sesión</h2>

    {% if form.errors %}
        <p>Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
